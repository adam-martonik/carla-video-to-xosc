# Configuration for CARLA Dashcam Video -> OpenSCENARIO 1.0 (.xosc) & OpenDRIVE (.xodr) Pipeline
# Units: SI (meters, seconds, radians, m/s, m/s^2, m/s^3)

camera:
  hfov_deg: 70.0
  cam_height_m: 1.35
  default_horizon_ratio: 0.52
  estimate_horizon: true
  horizon_min_ratio: 0.38
  horizon_max_ratio: 0.62
  min_depth_m: 2.5
  max_depth_m: 90.0

tracking:
  model_candidates:
    - "yolo11m.pt"
    - "yolo11n.pt"
  tracker: "botsort.yaml"
  fallback_tracker: "bytetrack.yaml"
  conf_threshold: 0.18
  vehicle_conf_threshold: 0.28
  max_actors: 4
  min_track_frames: 25
  min_track_duration_s: 1.0
  stitch_max_gap_s: 1.5
  stitch_max_dist_m: 5.0
  base_ego_speed_mps: 18.0
  night_sky_threshold: 65.0
  scene_cut_min_time_s: 10.0
  scene_cut_diff_threshold: 17.5

kinematics:
  sample_dt_s: 0.25
  outlier_mad_window: 11
  outlier_mad_thresh: 3.0
  rts_process_noise_pos: 0.4
  rts_meas_noise_z: 1.8
  rts_meas_noise_x: 0.45
  rts_ego_meas_noise_v: 1.5
  rts_ego_process_noise_a: 1.2
  min_safety_margin_long_m: 2.0
  min_safety_margin_lat_m: 0.45
  deconflict_iterations: 8

road:
  lane_width_m: 3.5
  shoulder_width_m: 2.2
  default_lanes_right: 2
  default_lanes_left: 1
  max_curvature_inv_m: 0.015
  generate_xodr: true

scenario:
  rev_major: 1
  rev_minor: 0
  author: "video_to_xosc_pipeline_v2"
  description: "CARLA:RealisticDashcamReconstructedScenario"
  speed_action_threshold_mps: 0.5
  speed_action_shape: "linear"
  waypoint_reached_threshold_m: 2.0
  default_friction: 1.0

